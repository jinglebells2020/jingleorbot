# facewatch defaults. Override by copying values into /opt/facewatch/config.toml
# (only the keys you change) and `sudo systemctl restart facewatch`.

[camera]
width = 1280
height = 720
detect_width = 640   # detection runs on a downscaled copy this wide
fps = 5              # sensor rate; the loop samples slower than this
hflip = false
vflip = false
autofocus = true     # Camera Module 3 continuous AF

[recognition]
match_threshold = 0.363          # SFace cosine operating point (OpenCV default)
unknown_match_threshold = 0.28   # looser: chains unknown sightings into sessions
min_face_px = 48                 # unknown faces narrower than this (in the
                                 # detect image) are ignored — too far to embed
det_score_threshold = 0.6        # YuNet confidence gate
idle_interval_s = 1.0        # loop cadence with no faces in view
busy_interval_s = 0.2        # loop cadence while faces are in view
watchdog_stall_s = 25        # no camera frame this long => restart service

[sessions]
absence_close_s = 60         # gone this long => session closed
retention_days = 30          # snapshots pruned after this

[weapons]
enabled = true
model = "weapon-yolov8n-320.onnx"   # in /opt/facewatch/models/
input_px = 320
conf = 0.30   # COCO-nano knife confidence runs low; fine-tuned model can raise this
interval_s = 2.0        # min seconds between YOLO passes (they cost ~1s CPU)
classes = ["knife", "scissors", "baseball bat"]  # COCO names to alert on

[events]
commotion_threshold = 12.0   # mean |frame diff| on the small view, 0-255
commotion_ticks = 2          # sustained this many ticks => commotion alert
alert_cooldown_s = 30        # per alert kind

[web]
port = 8093
